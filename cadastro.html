<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/cadastro.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <title>Cadastro</title>
</head>

<body>
    <div class="vlt">
      <a href="login.html" id="btnVoltarTopo">
        <i class="bi bi-arrow-left"></i></a>
    </div>

<form id="form-login" class="col-md-6 mx-auto">
  <div id="step-1" class="step active">
    <h1>Cadastro</h1>
    <div class="input-group">
      <input id="email" type="email" class="form-control" required placeholder="E-mail">
    </div>

        <div class="input-group">
      <input id="usuario" type="text" class="form-control" required placeholder="Nome de usuário">
    </div>

    <div class="input-group">
      <input id="senha" type="password" class="form-control" required placeholder="Senha">
    </div>
      <div class="form-text"><a href="#">Esqueceu a senha ?</a></div>

    <button id="btnCadas" type="button" class="btn btn-primary w-100">Entrar</button>

    <p class="text-center">Já tem conta? <a href="login.html">Entre</a></p>
  </div>
</form>

  <script src="js/cadastro.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
