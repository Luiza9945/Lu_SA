<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <title>Cadastro</title>
</head>

<body>

    <div class="vlt">
        <span>
            <a href="cadastro.html" class="text-decoration-none text-white">
                <i class="bi bi-arrow-left"></i>
            </a>
        </span>
    </div>

    <div class="d-flex justify-content-center align-items-center vh-100 p-3">
        <div class="login-card">

            <form>
                <h1 class=" d-flex justify-content-center fw-semibold mb-4">Complete seu Perfil</h1>

                <div class="foto-container">

                    <div class="foto-perfil">

                        <img id="previewFoto" src="" alt="Foto de Perfil">

                        <img id="imagemPadrao" src="imgs/Usuária.jpg" alt="Usuário">

                    </div>

                    <label for="foto" class="btn-foto">
                        <i class="bi bi-plus-lg"></i>
                    </label>

                    <input type="file" id="foto" accept="image/*" hidden>

                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input id="nome" type="text" class="form-control fw-light" placeholder="Nome" required>
                </div>

                <div class="position-relative">

                    <input type="text" id="categoria" class="form-control  , input-group"
                        placeholder="Digite sua categoria" autocomplete="off">

                    <div id="sugestoes" class="list-group position-absolute w-100"></div>

                </div>

                <textarea id="biografia" class="bio fw-light mb-2" placeholder="Sua biografia" (opcional) rows="2"
                    required></textarea>


                <button id="btnCadas" type="submit" onclick="finalizarCadastro()"
                    class="btn btn-light w-100 text-white fw-semibold mb-3">Cadastrar</button>

                <div class="text-center">
                    <p class="mb-2 text-white">Já possui uma conta?
                        <a href="login.html" class="text-decoration-none fw-bold">Entre</a>
                    </p>
                </div>
        </div>
        </form>
    </div>

    <script src="js/cadastro2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
