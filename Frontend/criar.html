<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/criar.css">
    <title>Criar post para Projeto</title>
</head>

<body>
     <header class="pb-2 ">
        <div class="linha1 d-flex justify-content-between align-items-center px-3">
            <div class="voltar">
                <a href="home.html"><i class="bi bi-arrow-left "></i></a>
            </div> 
        </div> 
    </header>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-white mb-4 text-center">Criar Novo Post</h2>
                <form id="createPostForm" action="#" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="postTitleInput" class="form-label text-white">Nome do post</label>
                        <input type="text" class="form-control" id="postTitleInput" placeholder="Digite o nome do post" required>
                    </div>
                    <div class="mb-3">
                        <label for="postDescriptionTextarea" class="form-label text-white">Descrição</label>
                        <textarea class="form-control" id="postDescriptionTextarea" rows="3" placeholder="Digite a descrição do post" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="postImage" class="form-label text-white">Imagem</label>
                        <input type="file" class="form-control" id="postImage" accept="image/*">
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="isPrivate">
                            <label class="form-check-label text-white" for="isPrivate">Privado</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="isInterestProject">
                            <label class="form-check-label text-white" for="isInterestProject">Projeto de interesse</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Criar Post</button>
                </form>
            </div>
        </div>
    </div>
    <script src="js/criar.js"></script>
</body>

</html>
