<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/perfil-art.css">
    <title>Seu perfil</title>
</head>
<body class="d-flex flex-column min-vh-100">

<header class="pb-2 ">
    <div class="linha1  d-flex justify-content-between align-items-center px-3">
        <div class="voltar">
            <a href="home.html"><i class="bi bi-arrow-left "></i></a>
        </div>
    <div class="opcoes dropdown">
            <i class="bi bi-three-dots-vertical" id="menu-icon" data-bs-toggle="dropdown" aria-expanded="false"></i>
            <!-- Menu dropdown com opções do perfil -->
            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark" aria-labelledby="menu-icon">
                <li><button class="dropdown-item" type="button" onclick="abrirEditarModal()">Editar perfil</button></li>
                <li><button class="dropdown-item text-danger" type="button" onclick="abrirApagarModal()">Apagar perfil</button></li>
            </ul>
        </div>
    </div>
    <div class="linha2 text-center ">
        <div class="foto-perfil d-inline-block">
            <img src="imgs/Usuária.jpg" alt="Foto de perfil do usuário">
        </div>
    </div>
    <div class="linha3 text-center">
        <h1 class="mb-0">Usuário</h1>
        <p>@usuario</p>
    </div>

   


</header>


<main class="pb-4">
    <div class="linha4 container pb-3">
        <div class="row">
            <div class="col-12">
                <p class="text-center">Faço desing e estou nesta área á 2 anos <br>
                Moro em florianópolis</p>
            </div>
        </div>
    </div>

    <div class="linha5">
        <div id="posts"   class="postagens">
            <div class="masonry">
            </div>
        </div>

        <div class="modal fade" id="lightbox" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-xl">
                <div class="modal-content bg-transparent border-0">
                    <div class="modal-header border-0">
                        <button type="button" class="btn-close btn-close-white ms-auto" onclick="closeLightbox()" aria-label="Close"></button>
                    </div>
                    <div class="modal-body text-center">
                        <img id="lightbox-img" src="" alt="Full image" class="img-fluid rounded-3 shadow-lg">
                        <h3 id="lightbox-title" class="text-white mt-3 text-center"></h3>
                    </div>
                </div>
            </div>
        </div>
        
     
       
</main>

 <footer class="mt-auto">
        <div class="icons d-flex justify-content-around align-items-center py-2 px-4">
            <a href="home.html"> <i class="bi bi-house-fill "></i></a>
            <a href="pesquisa.html"><i class="bi bi-search"></i></a>
            <a href="criar_post.html"><i class="bi bi-plus-circle "></i></a>
            <a href="messages.html"><i class="bi bi-chat-dots-fill"></i></a>
            <a href="perfil-art.html"><i class="bi bi-person-fill "></i></a>
        </div>
    </footer>
    <!-- Lightbox Modal Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/perfil-art.js"></script>
</body>
</html>
