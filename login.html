<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/login.css">
    <title>Login</title>
</head>

<body>

    <div class="vlt">

        <span><a href="index.html" class="text-decoration-none text-white "><i class="bi bi-arrow-left"></i></a></span>

    </div>

    <div class=" d-flex justify-content-center align-items-center  vh-100 p-3">

        <div class="login-card">

            <h1 class="fw-semibold mb-4 ">Login</h1>

            <form>
                <div class="input-group mb-4 ">
                    <span class=" input-group-text"> <i class="bi bi-person-fill"></i> </span>
                    <input id="email" type="email" class="form-control fw-light" placeholder="E-mail ou Usuario">
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input id="senha" type="password" class="form-control fw-light" placeholder="Senha">
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div><input type="checkbox" class="form-check-input">
                        <label class="form-check-label">Lembre-me</label>
                    </div>


                    <a href="#" class="text-white  text-decoration-none">Esqueceu a senha ?</a>
                </div>


                <button id="btn" type="submit" class="btn btn-light w-100 text-white fw-semibold  mb-3 ">Entrar</button>

                <div class="text-center">
                    <p class="mb-2 text-white">Não possui uma conta?
                        <a href="cadastro.html" class="text-decoration-none fw-bold">Cadastre-se</a>
                    </p>
                    <p class="text-white mb-2">ou</p>
                    <div class="icons">
                        <i class="bi bi-google"></i>
                        <i class="bi bi-facebook"></i>
                        <i class="bi bi-linkedin"></i>
                        <i class="bi bi-apple"></i>
                    </div>

            </form>
        </div>


    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/login.js"></script>

</body>

</html>
