<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <title>Login</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

  <div class="vlt">
    <a href="index.html">
      <i class="bi bi-arrow-left"></i></a>
  </div>

  <div class="container">


    <form id="form-login" class="col-md-6 mx-auto">
      <h1> Login </h1>

      <div class="input-group">
        <input id="email" type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
          required placeholder="E-mail ou Usuario">
      </div>
      <div class="input-group">
        <input id="senha" type="password" class="form-control" id="exampleInputPassword1" required placeholder="Senha">
      </div>

      <div class="form-text"><a href="#">Esqueceu a senha ?</a></div>


      <button id="btn" type="submit" class="btn btn-primary w-100   ">Entrar</button>
      <p class="text-center">Ainda não possui uma conta? <a href="cadastro.html">Cadastre-se</a></p>

      
    </form>


  </div>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="js/login.js"></script>

</body>

</html>
